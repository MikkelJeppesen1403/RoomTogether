<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Værelse — RoomTogether</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-nav"></div>
  <main class="wrap" id="page" style="padding-bottom:2rem"></main>
  <script src="js/app.js"></script>
  <script>
    renderNav('vaerelser.html')
    const id = qs('id')
    const data = db()
    const listing = data.listings.find(l => l.id === id)
    const page = document.getElementById('page')
    if (!listing) {
      page.innerHTML = '<div class="empty" style="margin-top:2rem">Opslag findes ikke.</div>'
    } else {
      const host = data.users.find(u => u.id === listing.userId)
      document.title = listing.title + ' — RoomTogether'
      const me = sessionUser()
      const score = isSeeker(me) ? matchScore(me.habits, listing.habits) : null
      const fav = isSeeker(me) && data.favorites.some(f => f.userId === me.id && f.listingId === listing.id)
      const own = me && me.id === listing.userId
      const actions = []
      if (!own) actions.push('<button class="btn btn-primary" id="msg">Skriv besked</button>')
      if (isSeeker(me) || !me) actions.push(`<button class="btn btn-ghost" id="fav">${fav ? '♥ Gemt' : '♡ Gem favorit'}</button>`)
      if (own) actions.push('<a class="btn btn-ghost" href="ansogere.html">Se ansøgere</a>')
      actions.push('<button class="btn btn-ghost" id="report">Anmeld</button>')

      const avail = availability(listing)
      const facts = [
        ['Husleje', money(listing.rent) + '/md'],
        ['Depositum', money(listing.deposit)],
        ['Størrelse', listing.size + ' m²'],
        ['Område', listing.area],
        ['Indflytning', avail.now ? 'Ledig nu' : dateDa(listing.moveIn)],
        ['Lejeperiode', listing.period]
      ]
      const similar = data.listings
        .filter(l => l.id !== listing.id)
        .map(l => ({ l, d: (l.area === listing.area ? 0 : 1) * 10000 + Math.abs(l.rent - listing.rent) }))
        .sort((a, b) => a.d - b.d)
        .slice(0, 3)

      page.innerHTML = `
        <div class="page-head"><a href="vaerelser.html" class="text-link">← Alle værelser</a></div>
        <div class="detail">
          <div>
            <div class="detail-gallery">
              ${listing.image ? `<img src="${listing.image}" alt="">` : ''}
              <span class="badge ${avail.now ? 'badge-now' : ''}">${avail.label}</span>
            </div>
            <div class="panel" style="margin-top:1rem">
              <p class="listing-area">${listing.area}, København</p>
              <h1 class="detail-title">${listing.title}</h1>
              <p style="opacity:.85;margin-bottom:1.25rem">${listing.desc}</p>
              <dl class="facts">${facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>
            </div>
          </div>
          <aside class="panel detail-side">
            <div class="detail-price"><span class="price">${money(listing.rent)}<small>/md</small></span>
              ${score != null ? `<span class="match-pill ${matchClass(score)}">${matchLabel(score)}</span>` : ''}</div>
            <hr>
            <p class="eyebrow">Nuværende beboer</p>
            <div class="host-row">
              ${host && host.photo ? `<img class="avatar" src="${host.photo}" alt="${host.name}">` : ''}
              <div>
                <h2>${host ? host.name : 'Ukendt'}${host && host.age ? ', ' + host.age : ''}</h2>
                <p class="review-meta">${host ? host.work || '' : ''}</p>
              </div>
            </div>
            <p style="opacity:.8;margin:.75rem 0 1rem">${host ? host.bio : ''}</p>
            ${score != null
              ? ''
              : isHost(me)
                ? '<p class="hint">Du er udlejer — match vises, når du åbner en ansøgers profil.</p>'
                : '<p class="hint">Log ind som lejer for at se, hvor godt I matcher.</p>'}
            <p class="eyebrow" style="margin-top:.5rem">Vaner i hjemmet</p>
            <div class="habits">${HABIT_KEYS.map(([k,label]) => `<div class="habit ${me && isSeeker(me) && me.habits[k] === listing.habits[k] ? 'same' : ''}"><b>${label}</b>${listing.habits[k]}</div>`).join('')}</div>
            <div class="detail-actions">${actions.join('')}</div>
          </aside>
        </div>
        ${similar.length ? `<section style="padding-bottom:1rem">
          <h2 class="section-title">Lignende værelser</h2>
          <div class="grid">${similar.map(({ l }) => listingCard(l, isSeeker(me) ? matchScore(me.habits, l.habits) : null)).join('')}</div>
        </section>` : ''}`

      const msgBtn = document.getElementById('msg')
      if (msgBtn) msgBtn.onclick = () => {
        if (!requireLogin('vaerelse.html?id=' + id)) return
        if (isHost(sessionUser()) && !isSeeker(sessionUser())) {
          toast('Som udlejer svarer du via Ansøgere / Beskeder')
          location.href = 'ansogere.html'
          return
        }
        location.href = 'beskeder.html?with=' + listing.userId + '&listing=' + listing.id
      }
      const favBtn = document.getElementById('fav')
      if (favBtn) favBtn.onclick = () => {
        const state = toggleFavorite(listing.id)
        if (state != null) favBtn.textContent = state ? '♥ Gemt' : '♡ Gem favorit'
      }
      document.getElementById('report').onclick = () => {
        if (!requireLogin('vaerelse.html?id=' + id)) return
        const reason = prompt('Hvorfor anmelder du dette opslag?')
        if (!reason) return
        const d = db()
        d.reports.push({ id: 'r' + Date.now(), type: 'listing', targetId: listing.id, fromUserId: sessionUser().id, reason, createdAt: Date.now(), status: 'open' })
        save(d)
        toast('Tak — anmeldelsen er sendt')
      }
    }
  </script>
</body>
</html>
